name: tables

on:
  workflow_dispatch:
    inputs:
      models:
        description: "models to run (comma list, or none)"
        default: "tatr,tatr32,tatr16,tatr4,potatr,potatr8,tcn,tfv2,tfv2q,slanet1m,tableformer"
      timing:
        description: "run the timing jobs"
        default: "true"
      probe:
        description: "only run the data-format probe"
        default: "false"
      reuse_runs:
        description: "earlier artifacts to include, as runid:pattern pairs separated by spaces"
        default: ""
      limit:
        description: "smoke test: only the first N tables of each set (empty = all)"
        default: ""
  push:
    paths:
      - "tables/**"
      - ".github/workflows/tables.yml"

env:
  TB_WORK: ${{ github.workspace }}/tables/work
  PYTHONUNBUFFERED: "1"
  HF_HUB_DISABLE_PROGRESS_BARS: "1"
  TB_LIMIT: ${{ inputs.limit }}
  TORCH_PIN: "torch==2.15.0 torchvision==0.29.2"

jobs:
  probe:
    if: ${{ inputs.probe == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install huggingface_hub==2.4.0 pyarrow==26.0.1
      - run: python tables/src/probe.py

  prep:
    if: ${{ inputs.probe != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      matrix: ${{ steps.mx.outputs.matrix }}
      has_jobs: ${{ steps.mx.outputs.has_jobs }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Matrix
        id: mx
        env:
          MODELS: ${{ github.event_name == 'workflow_dispatch' && inputs.models || 'tatr,tatr32,tatr16,tatr4,potatr,potatr8,tcn,tfv2,tfv2q,slanet1m,tableformer' }}
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, os
          n = {"tatr": 3, "tatr32": 4, "tatr16": 4, "tatr4": 4, "slanet1m": 2, "tcn": 8, "potatr": 6, "potatr8": 6, "tfv2": 12, "tfv2q": 12, "tableformer": 14}
          if os.environ.get("TB_LIMIT"): n = {k: 1 for k in n}
          inc = [dict(model=m, shard=i, nshards=n[m]) for m in os.environ["MODELS"].split(",") if m in n for i in range(n[m])]
          print("matrix=" + json.dumps({"include": inc}))
          print("has_jobs=" + ("true" if inc else "false"))
          EOF
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Restore sets
        id: sets
        uses: actions/cache/restore@v4
        with:
          path: tables/work/data/sets
          key: tables-sets-v2-${{ hashFiles('tables/src/prep_*.py', 'tables/src/fetch_data.py') }}
      - name: Install
        if: steps.sets.outputs.cache-hit != 'true'
        run: |
          pip install -r tables/requirements.txt
          pip uninstall -y opencv-python opencv-python-headless || true
          pip install opencv-python-headless==5.1.0.95
      - name: Fetch data
        if: steps.sets.outputs.cache-hit != 'true'
        working-directory: tables/src
        run: |
          df -h . | tail -1
          python fetch_data.py ptn ftn pt1m pt2 scitsr scitsr_pd icdar ours tabrec
          du -sh ../work/data/raw/* || true
      - name: Build sets (tag, stratify, sample)
        if: steps.sets.outputs.cache-hit != 'true'
        working-directory: tables/src
        run: |
          mkdir -p ../work/logs
          for s in ptn ftn pt1m; do python prep_sets.py $s > ../work/logs/prep_$s.log 2>&1 & done
          python prep_pt2.py > ../work/logs/prep_pt2.log 2>&1 &
          python prep_scitsr.py > ../work/logs/prep_scitsr.log 2>&1 &
          python prep_tabrec.py > ../work/logs/prep_tabrec.log 2>&1 &
          python prep_icdar.py > ../work/logs/prep_icdar.log 2>&1 &
          wait
          python prep_rot.py > ../work/logs/prep_rot.log 2>&1
          for f in ../work/logs/prep_*.log; do echo "== $f"; grep -v "^skip" $f | tail -n 8 | cut -c1-600; grep -c "^skip" $f || true; done
          for s in ptn ftn pt1m pt2 scitsr tabrec icdar rot; do test -s ../work/data/sets/$s/index.json; done
          rm -rf ../work/data/raw
          du -sh ../work/data/sets/*
      - name: Save sets
        if: steps.sets.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: tables/work/data/sets
          key: tables-sets-v2-${{ hashFiles('tables/src/prep_*.py', 'tables/src/fetch_data.py') }}
      - name: Set summary (counts only)
        working-directory: tables/src
        run: |
          python3 - <<'EOF' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os, collections
          S = os.path.join(os.environ["TB_WORK"], "data", "sets")
          tags = ["very_long", "very_wide", "tiny", "rotated", "split_page", "rotated_page", "multiline", "many_spans", "nested_header", "hier_first_col", "empty_cells", "footnote_marks", "ruled"]
          print("| set | n | simple | medium | complex | edge | " + " | ".join(tags) + " |")
          print("|" + "---|" * (6 + len(tags)))
          for s in ["ptn", "ftn", "pt1m", "pt2", "icdar", "scitsr", "tabrec", "rot"]:
              ids = json.load(open(os.path.join(S, s, "index.json")))
              T = [json.load(open(os.path.join(S, s, i + ".json"), encoding="utf-8"))["tags"] for i in ids]
              c = collections.Counter(t["bucket"] for t in T)
              print(f"| {s} | {len(ids)} | {c['simple']} | {c['medium']} | {c['complex']} | {c['edge']} | " + " | ".join(str(sum(1 for t in T if t.get(k))) for k in tags) + " |")
          EOF

  run:
    needs: prep
    if: ${{ needs.prep.outputs.has_jobs == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prep.outputs.matrix) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          M=${{ matrix.model }}
          pip install -r tables/requirements.txt
          case $M in
            potatr*|tfv2*) pip install $TORCH_PIN --index-url https://download.pytorch.org/whl/cpu ;;
          esac
          case $M in
            potatr*) pip install "git+https://github.com/kensho-technologies/POTATR@fdb8f57c5124ff27ad7c12bcb976b48a615f1131" --extra-index-url https://download.pytorch.org/whl/cpu ;;
            tfv2*) pip install docling-ibm-models==4.0.4 transformers==4.57.1 --extra-index-url https://download.pytorch.org/whl/cpu ;;
            tableformer) pip install docling-rs==2.84.0 ;;
            tcn) pip install "onnxtr @ git+https://github.com/felixdittrich92/OnnxTR@b77b5669ef84913b006b2da204d5a52f6eb0c7c7" ;;
          esac
          pip uninstall -y opencv-python opencv-python-headless || true
          pip install opencv-python-headless==5.1.0.95
          pip list 2>/dev/null | grep -i -E "^(onnx|onnxruntime|onnxtr|torch|torchvision|transformers|docling|potatr|numpy|pillow|opencv)" || true
      - uses: actions/cache/restore@v4
        with:
          path: tables/work/data/sets
          key: tables-sets-v2-${{ hashFiles('tables/src/prep_*.py', 'tables/src/fetch_data.py') }}
          fail-on-cache-miss: true
      - name: Fetch models
        working-directory: tables/src
        run: python fetch_models.py ${{ matrix.model }} grits
      - name: Run model
        working-directory: tables/src
        run: |
          nproc; free -g
          if [ "${{ matrix.model }}" = "tableformer" ]; then
            python run_tableformer.py --shard ${{ matrix.shard }} --nshards ${{ matrix.nshards }} --page letter
          else
            python bench_models.py ${{ matrix.model }} --shard ${{ matrix.shard }} --nshards ${{ matrix.nshards }}
          fi
      - name: Score
        working-directory: tables/src
        run: python score.py ../work/out/pred/${{ matrix.model }}_*_s${{ matrix.shard }}.jsonl --jobs 4
      - name: Our 7 tables
        if: matrix.shard == 0
        working-directory: tables/src
        continue-on-error: true
        run: |
          python fetch_data.py ours
          python run_ours.py ${{ matrix.model }} | tee ../work/out/pred/ours_${{ matrix.model }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pred-${{ matrix.model }}-s${{ matrix.shard }}
          path: tables/work/out/pred/
          if-no-files-found: warn

  timing:
    needs: prep
    if: ${{ inputs.probe != 'true' && (github.event_name != 'workflow_dispatch' || inputs.timing == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        group: [onnx, torch, docling]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install -r tables/requirements.txt
          case ${{ matrix.group }} in
            torch) pip install $TORCH_PIN --index-url https://download.pytorch.org/whl/cpu
                   pip install "git+https://github.com/kensho-technologies/POTATR@fdb8f57c5124ff27ad7c12bcb976b48a615f1131" docling-ibm-models==4.0.4 transformers==4.57.1 --extra-index-url https://download.pytorch.org/whl/cpu ;;
            docling) pip install docling-rs==2.84.0 ;;
            onnx) pip install "onnxtr @ git+https://github.com/felixdittrich92/OnnxTR@b77b5669ef84913b006b2da204d5a52f6eb0c7c7" ;;
          esac
          pip uninstall -y opencv-python opencv-python-headless || true
          pip install opencv-python-headless==5.1.0.95
      - uses: actions/cache/restore@v4
        with:
          path: tables/work/data/sets
          key: tables-sets-v2-${{ hashFiles('tables/src/prep_*.py', 'tables/src/fetch_data.py') }}
          fail-on-cache-miss: true
      - name: Timing (one model process at a time, 2 and 4 threads)
        working-directory: tables/src
        run: |
          nproc; lscpu | grep -E "Model name|^CPU\(s\)"; free -g
          mkdir -p ../work/out/speed
          case ${{ matrix.group }} in
            onnx) MS="tatr32 tatr16 tatr tatr4 slanet1m tcn" ;;
            torch) MS="potatr potatr8 tfv2 tfv2q" ;;
            docling) MS="tableformer" ;;
          esac
          for m in $MS; do python fetch_models.py $m; done
          for th in 2 4; do for m in $MS; do python bench_speed.py $m $th || echo "timing failed $m $th"; done; done
          if [ "${{ matrix.group }}" = "docling" ]; then DOCLING_RS_TIMING=1 python bench_speed.py tableformer 4 > ../work/out/speed/tf_stage_timing.txt 2>&1 || true; tail -n 40 ../work/out/speed/tf_stage_timing.txt; fi
          grep -m1 "model name" /proc/cpuinfo > ../work/out/speed/cpu_${{ matrix.group }}.txt
          mv ../work/out/speed/speed.jsonl ../work/out/speed/speed_${{ matrix.group }}.jsonl || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: speed-${{ matrix.group }}
          path: tables/work/out/speed/

  aggregate:
    needs: [run, timing]
    if: ${{ always() && inputs.probe != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install scipy==1.16.3 numpy==2.4.6
      - uses: actions/download-artifact@v4
        with:
          path: results
      - name: Artifacts from earlier runs
        if: ${{ inputs.reuse_runs != '' && inputs.reuse_runs != null }}
        env:
          GH_TOKEN: ${{ github.token }}
          REUSE: ${{ inputs.reuse_runs }}
        run: |
          for e in $REUSE; do
            id=${e%%:*}; pat=${e#*:}
            gh run download "$id" -R ${{ github.repository }} -p "$pat" -D "results/prev-$id"
          done
          ls results | head -100
      - name: Aggregate
        run: |
          python tables/src/agg.py results > /dev/null
          {
            echo "# Table structure benchmark"
            echo "## Timing"; cat $(find results -name "cpu_*.txt") 2>/dev/null || true; echo '```'; cat $(find results -name "speed_*.jsonl") 2>/dev/null || true; echo '```'
            echo "## Our 7 tables (cell accuracy vs truth.json)"; echo '```'; grep -rh "MEAN cell_acc" results 2>/dev/null || true; echo '```'
            cat results/report.md
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: report
          path: results/report.md
