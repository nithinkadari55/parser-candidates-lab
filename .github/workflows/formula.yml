name: formula

on:
  workflow_dispatch:
  push:
    paths:
      - "formula/**"
      - ".github/workflows/formula.yml"

concurrency:
  group: formula-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: formula
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: formula/requirements.txt
      - run: pip install -r requirements.txt
      - id: mcache
        uses: actions/cache@v4
        with:
          path: formula/models
          key: formula-models-v1-${{ hashFiles('formula/requirements.txt', 'formula/scripts/fetch_models.py', 'formula/scripts/quant.py', 'formula/scripts/split_dec.py') }}
      - name: Download models, build own INT8, split decoders
        if: steps.mcache.outputs.cache-hit != 'true'
        run: python scripts/fetch_models.py
      - id: dcache
        uses: actions/cache@v4
        with:
          path: |
            formula/data
            formula/manifests
          key: formula-data-v1-${{ hashFiles('formula/requirements.txt', 'formula/papers.json', 'formula/gt.json', 'formula/crops/**', 'formula/scripts/fetch_data.py', 'formula/scripts/arxiv_extract.py', 'formula/scripts/mk_unimer.py', 'formula/scripts/mk_wl.py', 'formula/scripts/texnorm.py', 'formula/scripts/mk_timing.py', 'formula/scripts/prune.py') }}
      - name: Download UniMER-Test and arXiv papers, build crops and manifests
        if: steps.dcache.outputs.cache-hit != 'true'
        run: |
          python scripts/fetch_data.py unimer arxiv
          mkdir -p manifests
          python scripts/mk_wl.py
          python scripts/mk_unimer.py
          python scripts/arxiv_extract.py
          python scripts/mk_timing.py x
          python scripts/prune.py
      - name: Dataset counts and model files
        run: |
          python scripts/counts.py
          cat models/models_info.json

  acc:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        model: [p2t15_fp32, p2t10_int8_mathorium, p2t15_int8_own]
        shard: [0, 1, 2, 3, 4, 5]
    defaults:
      run:
        working-directory: formula
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: formula/requirements.txt
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: formula/models
          key: formula-models-v1-${{ hashFiles('formula/requirements.txt', 'formula/scripts/fetch_models.py', 'formula/scripts/quant.py', 'formula/scripts/split_dec.py') }}
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: |
            formula/data
            formula/manifests
          key: formula-data-v1-${{ hashFiles('formula/requirements.txt', 'formula/papers.json', 'formula/gt.json', 'formula/crops/**', 'formula/scripts/fetch_data.py', 'formula/scripts/arxiv_extract.py', 'formula/scripts/mk_unimer.py', 'formula/scripts/mk_wl.py', 'formula/scripts/texnorm.py', 'formula/scripts/mk_timing.py', 'formula/scripts/prune.py') }}
          fail-on-cache-miss: true
      - name: Recognise shard (original ONNX graphs, greedy, 512-token cap, 4 threads)
        run: python scripts/run_shard.py ${{ matrix.model }} ${{ matrix.shard }} 6 4
      - uses: actions/upload-artifact@v4
        with:
          name: acc-${{ matrix.model }}-s${{ matrix.shard }}
          path: formula/results/acc/*.jsonl
          retention-days: 30

  timing:
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: formula
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: formula/requirements.txt
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: formula/models
          key: formula-models-v1-${{ hashFiles('formula/requirements.txt', 'formula/scripts/fetch_models.py', 'formula/scripts/quant.py', 'formula/scripts/split_dec.py') }}
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: |
            formula/data
            formula/manifests
          key: formula-data-v1-${{ hashFiles('formula/requirements.txt', 'formula/papers.json', 'formula/gt.json', 'formula/crops/**', 'formula/scripts/fetch_data.py', 'formula/scripts/arxiv_extract.py', 'formula/scripts/mk_unimer.py', 'formula/scripts/mk_wl.py', 'formula/scripts/texnorm.py', 'formula/scripts/mk_timing.py', 'formula/scripts/prune.py') }}
          fail-on-cache-miss: true
      - name: Timing, one model process at a time, 4 threads
        run: |
          nproc; free -m; lscpu | grep -E "Model name|^CPU\(s\)"
          for m in p2t15_fp32 p2t10_int8_mathorium p2t15_int8_own; do
            python scripts/timing.py $m 4
            python scripts/timing.py $m 4 fast
          done
      - uses: actions/upload-artifact@v4
        with:
          name: timing
          path: formula/results/timing/*.json
          retention-days: 30

  aggregate:
    needs: [acc, timing]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: formula
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: formula/requirements.txt
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: formula/models
          key: formula-models-v1-${{ hashFiles('formula/requirements.txt', 'formula/scripts/fetch_models.py', 'formula/scripts/quant.py', 'formula/scripts/split_dec.py') }}
      - uses: actions/cache/restore@v4
        with:
          path: |
            formula/data
            formula/manifests
          key: formula-data-v1-${{ hashFiles('formula/requirements.txt', 'formula/papers.json', 'formula/gt.json', 'formula/crops/**', 'formula/scripts/fetch_data.py', 'formula/scripts/arxiv_extract.py', 'formula/scripts/mk_unimer.py', 'formula/scripts/mk_wl.py', 'formula/scripts/texnorm.py', 'formula/scripts/mk_timing.py', 'formula/scripts/prune.py') }}
          fail-on-cache-miss: true
      - uses: actions/download-artifact@v4
        with:
          pattern: acc-*
          merge-multiple: true
          path: formula/results/acc
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: timing
          path: formula/results/timing
      - name: Metrics per set, difficulty bucket and edge slice
        run: |
          python scripts/evaluate.py p2t15_fp32,p2t10_int8_mathorium,p2t15_int8_own > results/eval_table.tsv
          python scripts/make_report.py > /dev/null
          cat results/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: formula-report
          path: |
            formula/results/report.md
            formula/results/metrics.json
            formula/results/eval_table.tsv
          retention-days: 30
