name: formula

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe (prep + short probe of every model) or full (whole benchmark)"
        type: choice
        options: [probe, full, timing]
        default: probe
      only:
        description: "full mode: comma-separated model ids to run (empty = all)"
        type: string
        default: ""
      from_runs:
        description: "aggregate: comma-separated earlier run ids whose acc/timing/cdm artifacts are merged in"
        type: string
        default: ""
  push:
    paths:
      - "formula/**"
      - ".github/workflows/formula.yml"

concurrency:
  group: formula-${{ github.ref }}-${{ inputs.mode || 'probe' }}-${{ inputs.only }}-${{ inputs.from_runs }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MONKEY_REPO: /tmp/MonkeyOCRv2/formula
  MONKEY_SHA: da96afede92f198c19aca74e1e5f5aa7f4c26af2

jobs:
  prep-models:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults: { run: { working-directory: formula } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: "formula/requirements*.txt" }
      - run: pip install -r requirements.txt
      - id: c
        uses: actions/cache@v4
        with:
          path: formula/models
          key: formula-mfr-v3-${{ hashFiles('formula/requirements.txt', 'formula/scripts/fetch_models.py', 'formula/scripts/quant.py', 'formula/scripts/split_dec.py', 'formula/scripts/build_variants.py', 'formula/scripts/mfr.py', 'formula/gt.json', 'formula/crops/**') }}
      - name: MFR 1.5 fp32, own INT8, split decoder, fp16, int16, int4 variants
        if: steps.c.outputs.cache-hit != 'true'
        run: |
          pip install onnx-ir==1.1.0
          python scripts/fetch_models.py
      - run: cat models/variants_status.json; du -sh models/*

  prep-ref:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults: { run: { working-directory: formula } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: "formula/requirements*.txt" }
      - run: pip install -r requirements.txt
      - id: c
        uses: actions/cache@v4
        with:
          path: formula/models_ref
          key: formula-ref-v2-${{ hashFiles('formula/requirements.txt', 'formula/scripts/fetch_ref.py') }}
      - name: PP-FormulaNet_plus-S, UniRec-0.1B, docTR FormulaNet (+ INT8)
        if: steps.c.outputs.cache-hit != 'true'
        run: python scripts/fetch_ref.py
      - run: du -sh models_ref/*

  prep-monkey:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults: { run: { working-directory: formula } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: "formula/requirements*.txt" }
      - run: pip install -r requirements_monkey.txt
      - run: git clone -q https://github.com/Yuliang-Liu/MonkeyOCRv2.git /tmp/MonkeyOCRv2 && git -C /tmp/MonkeyOCRv2 checkout -q $MONKEY_SHA
      - id: c
        uses: actions/cache@v4
        with:
          path: formula/models_monkey
          key: formula-monkey-v1-${{ hashFiles('formula/requirements_monkey.txt', 'formula/scripts/monkey_prep.py', 'formula/scripts/monkey_torch.py', 'formula/scripts/refmodels.py', 'formula/scripts/split_dec.py') }}
      - name: MonkeyOCRv2-S formula weights (internal test only), strip, ONNX export, INT8, parity
        if: steps.c.outputs.cache-hit != 'true'
        run: python scripts/monkey_prep.py
      - run: cat models_monkey/monkey_info.json; du -sh models_monkey/*

  prep-data:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults: { run: { working-directory: formula } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: "formula/requirements*.txt" }
      - run: pip install -r requirements.txt
      - id: c
        uses: actions/cache@v4
        with:
          path: |
            formula/data
            formula/manifests
          key: formula-data-v2-${{ hashFiles('formula/requirements.txt', 'formula/papers.json', 'formula/gt.json', 'formula/crops/**', 'formula/scripts/fetch_data.py', 'formula/scripts/arxiv_extract.py', 'formula/scripts/mk_unimer.py', 'formula/scripts/mk_wl.py', 'formula/scripts/texnorm.py', 'formula/scripts/taxonomy.py', 'formula/scripts/mk_timing.py', 'formula/scripts/mk_cdm_subset.py', 'formula/scripts/prune.py') }}
      - name: UniMER-Test (full), arXiv sources and PDFs, crops and manifests
        if: steps.c.outputs.cache-hit != 'true'
        run: |
          python -c "from huggingface_hub import hf_hub_download; hf_hub_download('breezedeus/pix2text-mfr-1.5', 'tokenizer.json', revision='1cef9f0bdcd6a4c63df7de1311fb0894593340cc', local_dir='models/breezedeus__pix2text-mfr-1.5')"
          python scripts/fetch_data.py unimer arxiv
          mkdir -p manifests
          python scripts/mk_wl.py
          python scripts/mk_unimer.py
          python scripts/arxiv_extract.py
          python scripts/mk_timing.py
          python scripts/mk_cdm_subset.py
          python scripts/prune.py
      - run: python scripts/counts.py; du -sh data

  probe:
    if: ${{ (inputs.mode || 'probe') == 'probe' }}
    needs: [prep-models, prep-ref, prep-data, prep-monkey]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        env: [main, monkey]
    defaults: { run: { working-directory: formula } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: "formula/requirements*.txt" }
      - if: matrix.env == 'main'
        run: pip install -r requirements.txt
      - if: matrix.env == 'monkey'
        run: |
          pip install -r requirements_monkey.txt
          git clone -q https://github.com/Yuliang-Liu/MonkeyOCRv2.git /tmp/MonkeyOCRv2 && git -C /tmp/MonkeyOCRv2 checkout -q $MONKEY_SHA
      - if: matrix.env == 'main'
        uses: actions/cache/restore@v4
        with:
          path: formula/models
          key: formula-mfr-v3-${{ hashFiles('formula/requirements.txt', 'formula/scripts/fetch_models.py', 'formula/scripts/quant.py', 'formula/scripts/split_dec.py', 'formula/scripts/build_variants.py', 'formula/scripts/mfr.py', 'formula/gt.json', 'formula/crops/**') }}
          fail-on-cache-miss: true
      - if: matrix.env == 'main'
        uses: actions/cache/restore@v4
        with:
          path: formula/models_ref
          key: formula-ref-v2-${{ hashFiles('formula/requirements.txt', 'formula/scripts/fetch_ref.py') }}
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: formula/models_monkey
          key: formula-monkey-v1-${{ hashFiles('formula/requirements_monkey.txt', 'formula/scripts/monkey_prep.py', 'formula/scripts/monkey_torch.py', 'formula/scripts/refmodels.py', 'formula/scripts/split_dec.py') }}
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: |
            formula/data
            formula/manifests
          key: formula-data-v2-${{ hashFiles('formula/requirements.txt', 'formula/papers.json', 'formula/gt.json', 'formula/crops/**', 'formula/scripts/fetch_data.py', 'formula/scripts/arxiv_extract.py', 'formula/scripts/mk_unimer.py', 'formula/scripts/mk_wl.py', 'formula/scripts/texnorm.py', 'formula/scripts/taxonomy.py', 'formula/scripts/mk_timing.py', 'formula/scripts/mk_cdm_subset.py', 'formula/scripts/prune.py') }}
          fail-on-cache-miss: true
      - if: matrix.env == 'main'
        run: PROBE_N=24 python scripts/probe.py p2t15_fp32,p2t15_fp16,p2t15_int16,p2t15_int8,p2t15_int8_split,p2t15_int4_b32,p2t15_int4_b128,pp_formulanet_plus_s,unirec_0_1b,doctr_formulanet,doctr_formulanet_int8,monkey_s_onnx_fp32,monkey_s_onnx_int8
      - if: matrix.env == 'monkey'
        run: PROBE_N=24 python scripts/probe.py monkey_s_torch

  plan:
    if: ${{ inputs.mode == 'full' || inputs.mode == 'timing' }}
    needs: [prep-models, prep-ref, prep-data, prep-monkey]
    runs-on: ubuntu-latest
    outputs:
      acc: ${{ steps.p.outputs.acc }}
      timing: ${{ steps.p.outputs.timing }}
      cdm: ${{ steps.p.outputs.cdm }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        run: |
          echo "acc=$(python3 formula/scripts/plan.py acc '${{ inputs.only }}')" >> "$GITHUB_OUTPUT"
          echo "timing=$(python3 formula/scripts/plan.py timing '${{ inputs.only }}')" >> "$GITHUB_OUTPUT"
          echo "cdm=$(python3 formula/scripts/plan.py cdm '${{ inputs.only }}')" >> "$GITHUB_OUTPUT"

  acc:
    needs: plan
    if: ${{ inputs.mode == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 125
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.acc) }}
    defaults: { run: { working-directory: formula } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: "formula/requirements*.txt" }
      - if: matrix.model != 'monkey_s_torch'
        run: pip install -r requirements.txt
      - if: matrix.model == 'monkey_s_torch'
        run: |
          pip install -r requirements_monkey.txt
          git clone -q https://github.com/Yuliang-Liu/MonkeyOCRv2.git /tmp/MonkeyOCRv2 && git -C /tmp/MonkeyOCRv2 checkout -q $MONKEY_SHA
      - if: startsWith(matrix.model, 'p2t15')
        uses: actions/cache/restore@v4
        with:
          path: formula/models
          key: formula-mfr-v3-${{ hashFiles('formula/requirements.txt', 'formula/scripts/fetch_models.py', 'formula/scripts/quant.py', 'formula/scripts/split_dec.py', 'formula/scripts/build_variants.py', 'formula/scripts/mfr.py', 'formula/gt.json', 'formula/crops/**') }}
          fail-on-cache-miss: true
      - if: startsWith(matrix.model, 'pp_') || startsWith(matrix.model, 'unirec') || startsWith(matrix.model, 'doctr')
        uses: actions/cache/restore@v4
        with:
          path: formula/models_ref
          key: formula-ref-v2-${{ hashFiles('formula/requirements.txt', 'formula/scripts/fetch_ref.py') }}
          fail-on-cache-miss: true
      - if: startsWith(matrix.model, 'monkey')
        uses: actions/cache/restore@v4
        with:
          path: formula/models_monkey
          key: formula-monkey-v1-${{ hashFiles('formula/requirements_monkey.txt', 'formula/scripts/monkey_prep.py', 'formula/scripts/monkey_torch.py', 'formula/scripts/refmodels.py', 'formula/scripts/split_dec.py') }}
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: |
            formula/data
            formula/manifests
          key: formula-data-v2-${{ hashFiles('formula/requirements.txt', 'formula/papers.json', 'formula/gt.json', 'formula/crops/**', 'formula/scripts/fetch_data.py', 'formula/scripts/arxiv_extract.py', 'formula/scripts/mk_unimer.py', 'formula/scripts/mk_wl.py', 'formula/scripts/texnorm.py', 'formula/scripts/taxonomy.py', 'formula/scripts/mk_timing.py', 'formula/scripts/mk_cdm_subset.py', 'formula/scripts/prune.py') }}
          fail-on-cache-miss: true
      - name: Recognise shard (4 threads)
        run: BUDGET_S=6600 python scripts/run_shard.py ${{ matrix.model }} ${{ matrix.shard }} ${{ matrix.n }} 4 ${{ matrix.sets }}
      - uses: actions/upload-artifact@v4
        with:
          name: acc-${{ matrix.model }}-s${{ matrix.shard }}
          path: formula/results/acc/*.jsonl
          retention-days: 30

  timing:
    needs: plan
    if: ${{ inputs.mode == 'full' || inputs.mode == 'timing' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.timing) }}
    defaults: { run: { working-directory: formula } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: "formula/requirements*.txt" }
      - if: matrix.env == 'main'
        run: pip install -r requirements.txt
      - if: matrix.env == 'monkey'
        run: |
          pip install -r requirements_monkey.txt
          git clone -q https://github.com/Yuliang-Liu/MonkeyOCRv2.git /tmp/MonkeyOCRv2 && git -C /tmp/MonkeyOCRv2 checkout -q $MONKEY_SHA
      - uses: actions/cache/restore@v4
        with:
          path: formula/models
          key: formula-mfr-v3-${{ hashFiles('formula/requirements.txt', 'formula/scripts/fetch_models.py', 'formula/scripts/quant.py', 'formula/scripts/split_dec.py', 'formula/scripts/build_variants.py', 'formula/scripts/mfr.py', 'formula/gt.json', 'formula/crops/**') }}
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: formula/models_ref
          key: formula-ref-v2-${{ hashFiles('formula/requirements.txt', 'formula/scripts/fetch_ref.py') }}
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: formula/models_monkey
          key: formula-monkey-v1-${{ hashFiles('formula/requirements_monkey.txt', 'formula/scripts/monkey_prep.py', 'formula/scripts/monkey_torch.py', 'formula/scripts/refmodels.py', 'formula/scripts/split_dec.py') }}
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: |
            formula/data
            formula/manifests
          key: formula-data-v2-${{ hashFiles('formula/requirements.txt', 'formula/papers.json', 'formula/gt.json', 'formula/crops/**', 'formula/scripts/fetch_data.py', 'formula/scripts/arxiv_extract.py', 'formula/scripts/mk_unimer.py', 'formula/scripts/mk_wl.py', 'formula/scripts/texnorm.py', 'formula/scripts/taxonomy.py', 'formula/scripts/mk_timing.py', 'formula/scripts/mk_cdm_subset.py', 'formula/scripts/prune.py') }}
          fail-on-cache-miss: true
      - name: Timing on the fixed 330-formula set; all models of the group one after another on this machine, 4 threads
        env:
          TIMING_GROUP: ${{ matrix.group }}
        run: |
          nproc; free -m; lscpu | grep -E "Model name|^CPU\(s\)"
          mkdir -p results/timing/${{ matrix.group }}
          lscpu | grep "Model name" > results/timing/${{ matrix.group }}/cpu.txt
          for m in $(echo "${{ matrix.models }}" | tr ',' ' '); do python scripts/timing.py $m 4 || echo "timing failed for $m"; done
      - uses: actions/upload-artifact@v4
        with:
          name: timing-${{ matrix.group }}
          path: formula/results/timing
          retention-days: 30

  cdm:
    needs: [plan, acc]
    if: ${{ !cancelled() && needs.plan.result == 'success' && inputs.mode == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.cdm) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - name: TeX Live subset, ImageMagick, Ghostscript, CDM (UniMERNet @5a2c80d)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends texlive-latex-base texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended imagemagick ghostscript
          sudo sed -i 's/rights="none" pattern="PDF"/rights="read|write" pattern="PDF"/' /etc/ImageMagick-6/policy.xml
          printf '#!/bin/sh\nexec convert "$@"\n' | sudo tee /usr/local/bin/magick && sudo chmod +x /usr/local/bin/magick
          git clone -q https://github.com/opendatalab/UniMERNet.git /tmp/UniMERNet && git -C /tmp/UniMERNet checkout -q 5a2c80d96b1d2dba447ff18d873e5fb73ba03c35
          pip install -q tqdm matplotlib "numpy<2.0.0" "scikit-image<=0.20.0" scipy "opencv-python-headless<4.12"
          node --version; pdflatex -version | head -1; kpsewhich upgreek.sty
      - uses: actions/cache/restore@v4
        with:
          path: |
            formula/data
            formula/manifests
          key: formula-data-v2-${{ hashFiles('formula/requirements.txt', 'formula/papers.json', 'formula/gt.json', 'formula/crops/**', 'formula/scripts/fetch_data.py', 'formula/scripts/arxiv_extract.py', 'formula/scripts/mk_unimer.py', 'formula/scripts/mk_wl.py', 'formula/scripts/texnorm.py', 'formula/scripts/taxonomy.py', 'formula/scripts/mk_timing.py', 'formula/scripts/mk_cdm_subset.py', 'formula/scripts/prune.py') }}
          fail-on-cache-miss: true
      - uses: actions/download-artifact@v4
        with:
          pattern: acc-${{ matrix.model }}-s*
          merge-multiple: true
          path: formula/results/acc
      - name: CDM on the fixed 3000-case subset
        run: python formula/scripts/cdm_run.py ${{ matrix.model }} ${{ matrix.shard }} ${{ matrix.n }} /tmp/UniMERNet/cdm
      - uses: actions/upload-artifact@v4
        with:
          name: cdm-${{ matrix.model }}-s${{ matrix.shard }}
          path: formula/results/cdm/*.json
          retention-days: 30

  aggregate:
    needs: [plan, acc, timing, cdm]
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults: { run: { working-directory: formula } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: "formula/requirements*.txt" }
      - run: pip install -r requirements.txt
      - uses: actions/cache/restore@v4
        with:
          path: |
            formula/data
            formula/manifests
          key: formula-data-v2-${{ hashFiles('formula/requirements.txt', 'formula/papers.json', 'formula/gt.json', 'formula/crops/**', 'formula/scripts/fetch_data.py', 'formula/scripts/arxiv_extract.py', 'formula/scripts/mk_unimer.py', 'formula/scripts/mk_wl.py', 'formula/scripts/texnorm.py', 'formula/scripts/taxonomy.py', 'formula/scripts/mk_timing.py', 'formula/scripts/mk_cdm_subset.py', 'formula/scripts/prune.py') }}
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: formula/models
          key: formula-mfr-v3-${{ hashFiles('formula/requirements.txt', 'formula/scripts/fetch_models.py', 'formula/scripts/quant.py', 'formula/scripts/split_dec.py', 'formula/scripts/build_variants.py', 'formula/scripts/mfr.py', 'formula/gt.json', 'formula/crops/**') }}
      - uses: actions/cache/restore@v4
        with:
          path: formula/models_ref
          key: formula-ref-v2-${{ hashFiles('formula/requirements.txt', 'formula/scripts/fetch_ref.py') }}
      - uses: actions/cache/restore@v4
        with:
          path: formula/models_monkey
          key: formula-monkey-v1-${{ hashFiles('formula/requirements_monkey.txt', 'formula/scripts/monkey_prep.py', 'formula/scripts/monkey_torch.py', 'formula/scripts/refmodels.py', 'formula/scripts/split_dec.py') }}
      - uses: actions/download-artifact@v4
        with: { pattern: acc-*, merge-multiple: true, path: formula/results/acc }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { pattern: timing-*, path: formula/results/timing_dl }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { pattern: cdm-*, merge-multiple: true, path: formula/results/cdm }
      - name: Collect grouped timing
        run: |
          mkdir -p results/timing
          if [ -d results/timing_dl ]; then for d in results/timing_dl/*; do cp -r "$d"/* results/timing/ 2>/dev/null || true; done; fi
          find results/timing -maxdepth 2 | head -50
      - name: Merge artifacts of earlier runs
        if: ${{ inputs.from_runs != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(echo "${{ inputs.from_runs }}" | tr ',' ' '); do
            for kind in acc cdm; do
              mkdir -p /tmp/prev/$id/$kind
              gh run download $id -R ${{ github.repository }} -p "$kind-*" -D /tmp/prev/$id/$kind || true
              mkdir -p results/$kind
              find /tmp/prev/$id/$kind -type f -exec cp -n {} results/$kind/ \;
            done
          done
          ls results/acc | wc -l
      - name: Metrics per set, difficulty bucket and tag; timing; CDM; report
        run: |
          python scripts/evaluate.py p2t15_fp32,p2t15_fp16,p2t15_int16,p2t15_int8,p2t15_int8_split,p2t15_int4_b32,p2t15_int4_b128,pp_formulanet_plus_s,unirec_0_1b,doctr_formulanet,doctr_formulanet_int8,monkey_s_torch,monkey_s_onnx_int8
          python scripts/make_report.py > /dev/null
          cat results/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: formula-report
          path: |
            formula/results/report.md
            formula/results/metrics.json
          retention-days: 30
