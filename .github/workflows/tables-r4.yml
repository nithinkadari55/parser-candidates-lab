name: tables-r4

on:
  workflow_dispatch:
    inputs:
      parts:
        description: "comma list of sel,miss,xpage"
        default: "sel,miss,xpage"
      limit:
        description: "smoke test: only the first N items per set/shard (empty = all)"
        default: ""
      reuse_run:
        description: "evaluation only: take the heavy r4sel-*/r4miss-* artifacts from this earlier run ID"
        default: ""

env:
  TB_WORK: ${{ github.workspace }}/tables/work
  PYTHONUNBUFFERED: "1"
  HF_HUB_DISABLE_PROGRESS_BARS: "1"
  TB_LIMIT: ${{ inputs.limit }}
  SPARTAN_PIN: "spartan-tables @ git+https://github.com/shlok-n/spartan@66ada02cc8a5a60c0b4a94fd6d2f56afd061515b"

jobs:
  sel_prep:
    if: ${{ contains(inputs.parts, 'sel') && inputs.reuse_run == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        src: [pt, brgm, icdar, scitsr]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - id: c
        uses: actions/cache/restore@v4
        with:
          path: tables/work/data/sets/r4${{ matrix.src }}
          key: r4sel-${{ matrix.src }}-v1-${{ inputs.limit }}-${{ hashFiles('tables/r4/r4_sel_prep.py', 'tables/r4/r4_common.py') }}
      - name: Free disk
        if: steps.c.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h . | tail -1
      - name: Install
        if: steps.c.outputs.cache-hit != 'true'
        run: |
          pip install -r tables/requirements.txt
          pip uninstall -y opencv-python opencv-python-headless || true
          pip install opencv-python-headless==5.1.0.95
      - name: Build set from the real source PDFs
        if: steps.c.outputs.cache-hit != 'true'
        working-directory: tables/r4
        run: |
          python r4_sel_prep.py ${{ matrix.src }} 2>&1 | grep -v "^skip" | tail -n 60
          test -s ../work/data/sets/r4${{ matrix.src }}/index.json
          du -sh ../work/data/sets/r4${{ matrix.src }}; cat ../work/data/sets/r4${{ matrix.src }}/prep_stats.json
      - if: steps.c.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: tables/work/data/sets/r4${{ matrix.src }}
          key: r4sel-${{ matrix.src }}-v1-${{ inputs.limit }}-${{ hashFiles('tables/r4/r4_sel_prep.py', 'tables/r4/r4_common.py') }}

  sel_run:
    needs: sel_prep
    if: ${{ always() && contains(inputs.parts, 'sel') && inputs.reuse_run == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - {model: tableformer, shard: 0, n: 10}
          - {model: tableformer, shard: 1, n: 10}
          - {model: tableformer, shard: 2, n: 10}
          - {model: tableformer, shard: 3, n: 10}
          - {model: tableformer, shard: 4, n: 10}
          - {model: tableformer, shard: 5, n: 10}
          - {model: tableformer, shard: 6, n: 10}
          - {model: tableformer, shard: 7, n: 10}
          - {model: tableformer, shard: 8, n: 10}
          - {model: tableformer, shard: 9, n: 10}
          - {model: tatr16, shard: 0, n: 5}
          - {model: tatr16, shard: 1, n: 5}
          - {model: tatr16, shard: 2, n: 5}
          - {model: tatr16, shard: 3, n: 5}
          - {model: tatr16, shard: 4, n: 5}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install -r tables/requirements.txt
          if [ "${{ matrix.model }}" = "tableformer" ]; then pip install docling-rs==2.84.0; fi
          pip uninstall -y opencv-python opencv-python-headless || true
          pip install opencv-python-headless==5.1.0.95
      - uses: actions/cache/restore@v4
        with:
          path: tables/work/data/sets/r4pt
          key: r4sel-pt-v1-${{ inputs.limit }}-${{ hashFiles('tables/r4/r4_sel_prep.py', 'tables/r4/r4_common.py') }}
      - uses: actions/cache/restore@v4
        with:
          path: tables/work/data/sets/r4brgm
          key: r4sel-brgm-v1-${{ inputs.limit }}-${{ hashFiles('tables/r4/r4_sel_prep.py', 'tables/r4/r4_common.py') }}
      - uses: actions/cache/restore@v4
        with:
          path: tables/work/data/sets/r4icdar
          key: r4sel-icdar-v1-${{ inputs.limit }}-${{ hashFiles('tables/r4/r4_sel_prep.py', 'tables/r4/r4_common.py') }}
      - uses: actions/cache/restore@v4
        with:
          path: tables/work/data/sets/r4scitsr
          key: r4sel-scitsr-v1-${{ inputs.limit }}-${{ hashFiles('tables/r4/r4_sel_prep.py', 'tables/r4/r4_common.py') }}
      - name: Models
        working-directory: tables/src
        run: |
          ls ../work/data/sets || true
          if [ "${{ matrix.model }}" = "tableformer" ]; then python fetch_models.py tableformer grits; else python fetch_models.py tatr16 grits; fi
      - name: Run
        working-directory: tables/r4
        run: nproc; python r4_sel_run.py ${{ matrix.model }} ${{ matrix.shard }} ${{ matrix.n }}
      - name: Score
        working-directory: tables/src
        run: python score.py ../work/out/pred/${{ matrix.model }}_*_s${{ matrix.shard }}.jsonl --jobs 4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r4sel-${{ matrix.model }}-${{ matrix.shard }}
          path: tables/work/out/pred/

  sel_eval:
    needs: sel_run
    if: ${{ always() && contains(inputs.parts, 'sel') }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install -r tables/requirements.txt scikit-learn==1.7.2 xgboost==3.1.1
          pip uninstall -y opencv-python opencv-python-headless || true
          pip install opencv-python-headless==5.1.0.95
      - name: Round-3 sets (for the frozen round-3 selector)
        uses: actions/cache/restore@v4
        with:
          path: tables/work/data/sets
          key: tables-sets-v2-${{ hashFiles('tables/src/prep_*.py', 'tables/src/fetch_data.py') }}
      - uses: actions/cache/restore@v4
        with:
          path: tables/work/data/sets/r4pt
          key: r4sel-pt-v1-${{ inputs.limit }}-${{ hashFiles('tables/r4/r4_sel_prep.py', 'tables/r4/r4_common.py') }}
      - uses: actions/cache/restore@v4
        with:
          path: tables/work/data/sets/r4brgm
          key: r4sel-brgm-v1-${{ inputs.limit }}-${{ hashFiles('tables/r4/r4_sel_prep.py', 'tables/r4/r4_common.py') }}
      - uses: actions/cache/restore@v4
        with:
          path: tables/work/data/sets/r4icdar
          key: r4sel-icdar-v1-${{ inputs.limit }}-${{ hashFiles('tables/r4/r4_sel_prep.py', 'tables/r4/r4_common.py') }}
      - uses: actions/cache/restore@v4
        with:
          path: tables/work/data/sets/r4scitsr
          key: r4sel-scitsr-v1-${{ inputs.limit }}-${{ hashFiles('tables/r4/r4_sel_prep.py', 'tables/r4/r4_common.py') }}
      - uses: actions/download-artifact@v4
        if: ${{ inputs.reuse_run == '' }}
        with:
          pattern: r4sel-*
          path: preds
      - name: Predictions of an earlier r4 run
        if: ${{ inputs.reuse_run != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ inputs.reuse_run }} -R ${{ github.repository }} -p "r4sel-*" -D preds
      - name: Round-3 predictions of run 44486868877 (TableFormer + TATR fp16)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 44486868877 -R ${{ github.repository }} -p "pred-tableformer-*" -p "pred-tatr16-*" -D r3preds
          ls tables/work/data/sets
      - name: Selector
        working-directory: tables/r4
        run: |
          cd ../src && python fetch_models.py grits && cd ../r4
          python r4_sel_eval.py ../../preds ../../r3preds | tail -n 120
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r4-sel
          path: tables/work/out/r4/

  miss_run:
    if: ${{ contains(inputs.parts, 'miss') && inputs.reuse_run == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - {ds: dln, shard: 0, n: 6}
          - {ds: dln, shard: 1, n: 6}
          - {ds: dln, shard: 2, n: 6}
          - {ds: dln, shard: 3, n: 6}
          - {ds: dln, shard: 4, n: 6}
          - {ds: dln, shard: 5, n: 6}
          - {ds: odb, shard: 0, n: 1}
          - {ds: sci, shard: 0, n: 3}
          - {ds: sci, shard: 1, n: 3}
          - {ds: sci, shard: 2, n: 3}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install -r tables/requirements.txt pydantic==2.11.7 pydantic-settings==2.10.1
          pip install --no-deps "$SPARTAN_PIN"
          if [ "${{ matrix.ds }}" = "sci" ]; then
            pip install docling-rs==2.84.0
            python -c "from docling_rs import models as m; m.download_models(dest='/home/runner/dlrs', progress=False, enrichment=False)"
            ls -la /home/runner/dlrs/models
          fi
          pip uninstall -y opencv-python opencv-python-headless || true
          pip install opencv-python-headless==5.1.0.95
          python -c "import spartan, spartan.region_segmentation, spartan.text_extraction; print('spartan', spartan.__version__)"
      - name: Heron INT8 detections and DocLayNet GT of order run 44477997398
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 44477997398 -R ${{ github.repository }} -p "layout-heron_int8-*" -p "layout-heron-*" -D art
      - name: Proposals
        working-directory: tables/r4
        run: nproc; python r4_miss.py ${{ matrix.ds }} ${{ matrix.shard }} ${{ matrix.n }} ../../art
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r4miss-${{ matrix.ds }}-${{ matrix.shard }}
          path: tables/work/out/r4/miss-*.jsonl

  miss_eval:
    needs: miss_run
    if: ${{ always() && contains(inputs.parts, 'miss') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy==2.4.6 scipy==1.16.3
      - uses: actions/download-artifact@v4
        if: ${{ inputs.reuse_run == '' }}
        with:
          pattern: r4miss-*
          path: res
      - name: Proposals of an earlier r4 run
        if: ${{ inputs.reuse_run != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ inputs.reuse_run }} -R ${{ github.repository }} -p "r4miss-*" -D res
      - run: python tables/r4/r4_miss_eval.py res | tail -n 150
      - uses: actions/upload-artifact@v4
        with:
          name: r4-miss
          path: res/r4/

  xpage:
    if: ${{ contains(inputs.parts, 'xpage') }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install numpy==2.4.6 scipy==1.16.3 huggingface_hub==0.35.3 lxml==6.1.3
      - working-directory: tables/r4
        run: python r4_xpage.py | tail -n 60
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r4-xpage
          path: tables/work/out/r4/

  report:
    needs: [sel_eval, miss_eval, xpage]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@v4
        with:
          pattern: r4-*
          path: rep
      - run: |
          python tables/r4/r4_report.py rep ${{ github.run_id }} > /dev/null
          cat rep/REPORT.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: r4-report
          path: rep/REPORT.md
