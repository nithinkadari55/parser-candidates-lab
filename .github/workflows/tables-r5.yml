name: tables-r5

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "smoke test: only the first N tables per set (empty = all)"
        default: ""
      reuse_run:
        description: "selector only: take the r5tatr-* artifacts from this earlier tables-r5 run ID"
        default: ""

env:
  TB_WORK: ${{ github.workspace }}/tables/work
  PYTHONUNBUFFERED: "1"
  HF_HUB_DISABLE_PROGRESS_BARS: "1"
  TB_LIMIT: ${{ inputs.limit }}
  R4_RUN: "44879805191"

jobs:
  tatr:
    if: ${{ inputs.reuse_run == '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tables/r5/words
      - name: Build the docling.rs word tool
        working-directory: tables/r5/words
        run: cargo build --release
      - name: Round-4 sets (source PDFs, crops, answer keys)
        run: echo "restoring"
      - uses: actions/cache/restore@v4
        with:
          path: tables/work/data/sets/r4pt
          key: r4sel-pt-v1--${{ hashFiles('tables/r4/r4_sel_prep.py', 'tables/r4/r4_common.py') }}
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: tables/work/data/sets/r4brgm
          key: r4sel-brgm-v1--${{ hashFiles('tables/r4/r4_sel_prep.py', 'tables/r4/r4_common.py') }}
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: tables/work/data/sets/r4icdar
          key: r4sel-icdar-v1--${{ hashFiles('tables/r4/r4_sel_prep.py', 'tables/r4/r4_common.py') }}
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: tables/work/data/sets/r4scitsr
          key: r4sel-scitsr-v1--${{ hashFiles('tables/r4/r4_sel_prep.py', 'tables/r4/r4_common.py') }}
          fail-on-cache-miss: true
      - name: Install
        run: |
          pip install -r tables/requirements.txt
          pip uninstall -y opencv-python opencv-python-headless || true
          pip install opencv-python-headless==5.1.0.95
      - name: Models
        working-directory: tables/src
        run: python fetch_models.py tatr16
      - name: Words and crops from docling.rs
        working-directory: tables/r5
        run: |
          python r5_tatr.py jobs ${{ matrix.shard }} 5 "$RUNNER_TEMP/jobs.jsonl"
          time ./words/target/release/r5words "$RUNNER_TEMP/jobs.jsonl" "$TB_WORK/r5words"
      - name: TATR fp16 with docling words
        working-directory: tables/r5
        run: nproc; python r5_tatr.py run ${{ matrix.shard }} 5 "$TB_WORK/r5words"
      - name: Score
        working-directory: tables/src
        run: python score.py ../work/out/pred/tatr16r5_*_s${{ matrix.shard }}.jsonl --jobs 4
      - name: Pack
        if: always()
        run: |
          mkdir -p pack/words
          cp -r tables/work/out/pred pack/ || true
          cp -r tables/work/out/r5fix pack/ || true
          (cd tables/work/r5words && find . -name '*.json' | tar -cf - -T - | tar -xf - -C ../../../pack/words) || true
          du -sh pack
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r5tatr-${{ matrix.shard }}
          path: pack/
          retention-days: 30

  sel:
    needs: tatr
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: |
          pip install -r tables/requirements.txt scikit-learn==1.7.2 xgboost==3.1.1
          pip uninstall -y opencv-python opencv-python-headless || true
          pip install opencv-python-headless==5.1.0.95
      - uses: actions/cache/restore@v4
        with:
          path: tables/work/data/sets/r4pt
          key: r4sel-pt-v1--${{ hashFiles('tables/r4/r4_sel_prep.py', 'tables/r4/r4_common.py') }}
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: tables/work/data/sets/r4brgm
          key: r4sel-brgm-v1--${{ hashFiles('tables/r4/r4_sel_prep.py', 'tables/r4/r4_common.py') }}
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: tables/work/data/sets/r4icdar
          key: r4sel-icdar-v1--${{ hashFiles('tables/r4/r4_sel_prep.py', 'tables/r4/r4_common.py') }}
          fail-on-cache-miss: true
      - uses: actions/cache/restore@v4
        with:
          path: tables/work/data/sets/r4scitsr
          key: r4sel-scitsr-v1--${{ hashFiles('tables/r4/r4_sel_prep.py', 'tables/r4/r4_common.py') }}
          fail-on-cache-miss: true
      - uses: actions/download-artifact@v4
        if: ${{ inputs.reuse_run == '' }}
        with:
          pattern: r5tatr-*
          path: r5
      - name: TATR artifacts of an earlier r5 run
        if: ${{ inputs.reuse_run != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download ${{ inputs.reuse_run }} -R ${{ github.repository }} -p "r5tatr-*" -D r5
      - name: TableFormer predictions of round-4 run 44879805191 (docling-rs 2.84.0)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download $R4_RUN -R ${{ github.repository }} -p "r4sel-tableformer-*" -D tfpreds
      - name: Merge words
        run: |
          mkdir -p words
          for d in r5/r5tatr-*/words; do cp -r "$d"/. words/; done
          for s in words/*; do echo "$s $(ls $s | wc -l)"; done
      - name: Selector
        working-directory: tables/r5
        run: |
          cd ../src && python fetch_models.py grits && cd ../r5
          python r5_sel.py ../../tfpreds ../../r5 ../../words | tail -n 80
          cp ../../r5/r5tatr-0/r5fix/* ../work/out/r5/ || true
          cat ../work/out/r5/sel.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: r5-sel
          path: tables/work/out/r5/
          retention-days: 30
